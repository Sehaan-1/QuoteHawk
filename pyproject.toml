[project]
name = "quotehawk"
version = "0.1.0"
description = "Stateful, guarded RFQ-to-PO procurement agent prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "QuoteHawk contributors" }]
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2.0",
    "aiohttp>=3.13.4",
    "fastapi<0.142.0",
    "gcsfs>=2026.10.0",
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.12.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.12.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
[tool.ty.environment]
python-version = "3.11"
[tool.ty.src]
exclude = [".venv/**"]
[tool.ty.rules]
import-not-found = "ignore"
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-explicit-return = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./uv.lock,./.venv/**,./**/node_modules/**,./web/.next/**,./web/out/**,./web/public/taste/**,./web/package-lock.json,./mobile/package-lock.json"
