name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-cli:
    name: Agents CLI lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTS_CLI_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.8.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate the agents-cli lifecycle
        run: make ci-agents

  python-guardrails:
    name: Python guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.8.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run deterministic Python guardrails
        run: make ci-python

  buyer-workspace:
    name: Buyer workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate, build, export, and audit the web workspace
        run: make ci-web

  approval-companion:
    name: Approval companion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Type-check, export, and audit the Expo companion
        run: make ci-mobile
